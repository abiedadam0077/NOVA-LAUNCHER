name: build-apk

on:
  push:
    branches: [ arena/38d52947-nova-launcher, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log

      - name: Unit & widget tests
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Inspect APK
        run: |
          ls -la build/app/outputs/flutter-apk/
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Publish release with direct APK link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nova-v0.1.0
          name: "NOVA Launcher v0.1.0 (CI build)"
          body: |
            Automatic CI build of NOVA Launcher.
            - APK signed with a per-run CI key (installable on Android 7+).
            - See docs/STATUS.md for the honest feature/test report.
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk

      - name: Push logs on failure
        if: failure()
        run: |
          git config user.name "nova-ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p ci
          cp analyze.log test.log build.log ci/ 2>/dev/null || true
          git add -f ci/ || true
          git diff --cached --quiet || git commit -m "ci: logs [skip ci]"
          git push origin HEAD:arena/38d52947-nova-launcher || true
